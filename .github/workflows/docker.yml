name: Docker CI/CD

on:
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set tags
        run: |
          SHA="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAGS=veerabhadra50/fin-collect-action:latest,veerabhadra50/fin-collect-action:${SHA}" >> $GITHUB_ENV
          else
            echo "TAGS=veerabhadra50/fin-collect-action:dev,veerabhadra50/fin-collect-action:${SHA}" >> $GITHUB_ENV
          fi

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
